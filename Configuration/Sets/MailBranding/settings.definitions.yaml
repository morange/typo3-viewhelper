settings:
  sitekit.project.fax:
    category: Sitekit.project
    type: string
    default: ''
    label: 'Fax'

  sitekit.project.representative:
    category: Sitekit.project
    type: string
    default: ''
    label: 'Vertretungsberechtigte Person'

  sitekit.project.registerCourt:
    category: Sitekit.project
    type: string
    default: ''
    label: 'Registergericht'

  sitekit.project.registerNumber:
    category: Sitekit.project
    type: string
    default: ''
    label: 'Registernummer'

  sitekit.project.registerType:
    category: Sitekit.project
    type: string
    default: ''
    label: 'Registerart (z. B. "Eintragung im Vereinsregister")'
    description: 'Freitext, da abhängig von der Rechtsform (Vereinsregister, Handelsregister, Genossenschaftsregister, ...).'

  sitekit.project.taxNumber:
    category: Sitekit.project
    type: string
    default: ''
    label: 'Steuernummer'

  sitekit.project.brand.logo.file.email:
    category: Sitekit.project.brand
    type: string
    default: ''
    label: 'Logo für System-E-Mails, hell (PNG, EXT:...)'
    description: 'Separat von sitekit.project.brand.logo.file.svg, da E-Mail-Clients SVG meist nicht zuverlässig rendern. Leer = TYPO3-Standardlogik (Backend-Login-Logo bzw. TYPO3-Logo). Für den hellen Hintergrund (Light Mode bzw. Clients ohne Dark-Mode-Unterstützung).'

  sitekit.project.brand.logo.file.emailDark:
    category: Sitekit.project.brand
    type: string
    default: ''
    label: 'Logo für System-E-Mails, dunkel (PNG, EXT:...)'
    description: 'Variante für Dark-Mode-fähige E-Mail-Clients (prefers-color-scheme: dark), z. B. eine helle/invertierte Logo-Version für dunklen Hintergrund. Leer = es wird dieselbe Datei wie im Light Mode verwendet.'